<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>亚像素缝隙复现测试</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box;}
  .wrap {
    width: 301px; /* 无法被3整除，产生小数宽度 */
    display: flex;
  }
  .col {
    flex: 1;
    height: 120px;
  }
  .c1 { background: #0dd; }
  .c2 { background: #497cd2; }
  .c3 { background: #0dd; }
</style>
</head>
<body>
<div class="wrap">
  <div class="col c1"></div>
  <div class="col c2"></div>
  <div class="col c3"></div>
</div>

<script>
const cols = document.querySelectorAll('.col');
cols.forEach((el, idx) => {
  const cssWidth = getComputedStyle(el).width;
  const renderWidth = el.clientWidth;
  const rect = el.getBoundingClientRect();
  console.log(`第${idx+1}列 | css宽度:${cssWidth} | clientWidth:${renderWidth} | left:${rect.left}`);
})
</script>
</body>
</html>
